<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="スマートフォンのGPSで速度とラップタイムを計測するアプリ。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>GPS スピードメーター</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101d2d;--line:#273a50;--muted:#91a2b7;--cyan:#56e0d0;--white:#f4f8ff;--orange:#ffbd69;--red:#ff8a78}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 48% 20%,#142b41 0%,var(--bg) 60%);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}
    .app{min-height:100svh;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));display:grid;grid-template-rows:32px 1fr auto;gap:9px;max-width:1100px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;min-width:0}.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;letter-spacing:.09em;color:#dce9f5}.brand-mark{width:24px;height:24px;border:1px solid #2e5265;border-radius:8px;display:grid;place-items:center;color:var(--cyan);background:#112738}.brand-mark svg{width:16px}.header-tools{display:flex;align-items:center;gap:7px}.unit{display:flex;background:#0b1726;border:1px solid var(--line);border-radius:999px;padding:2px}.unit button{border:0;background:transparent;color:var(--muted);padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700}.unit button.active{background:#1b3547;color:var(--cyan)}.icon-button{border:1px solid var(--line);background:#102034;border-radius:9px;padding:5px 9px;color:#bfd0e0;font-size:11px}
    .dashboard{min-height:0;display:grid;grid-template-columns:minmax(105px,.82fr) minmax(220px,1.3fr) minmax(155px,1fr);grid-template-rows:minmax(82px,.8fr) minmax(118px,1.2fr);gap:10px}
    .panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#122236f2,#0c1827f5);padding:clamp(9px,1.7vw,16px);box-shadow:0 9px 26px #0002;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
    .label{font-size:clamp(9px,1.4vw,12px);font-weight:650;color:var(--muted);letter-spacing:.06em;white-space:nowrap}.timer-panel,.delta-panel,.target-panel{text-align:center;align-items:center}.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(22px,5.6vw,46px);letter-spacing:-.045em;line-height:1.15;white-space:nowrap}.delta{font-variant-numeric:tabular-nums;font-size:clamp(23px,5.5vw,43px);font-weight:650;letter-spacing:-.045em;white-space:nowrap;color:var(--cyan);line-height:1.15}.delta.late{color:var(--orange)}.target-lines{width:100%;display:grid;grid-template-columns:auto 1fr;column-gap:9px;row-gap:6px;align-items:center;margin-top:7px;font-size:clamp(10px,1.7vw,14px);font-variant-numeric:tabular-nums}.target-lines .key{color:var(--muted);font-size:.85em;text-align:left}.target-lines .val{text-align:right;white-space:nowrap;font-weight:650}.target-lines .max{color:var(--orange)}
    .lap-count-panel{align-items:center;text-align:center}.lap-count{font-size:clamp(26px,6vw,48px);line-height:1;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.04em;margin:8px 0}.lap-count small{font-size:.47em;color:var(--muted);font-weight:500;letter-spacing:0}.lap-progress{height:4px;width:min(100%,120px);background:#28394c;border-radius:4px;overflow:hidden}.lap-progress span{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}
    .speed-panel{align-items:center;text-align:center;padding-top:7px;padding-bottom:7px}.speed-reading{font-size:clamp(41px,11.5vw,82px);font-weight:650;letter-spacing:-.085em;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}.speed-reading small{font-size:.28em;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:7px}.average{display:flex;align-items:baseline;gap:9px;margin-top:8px;font-size:clamp(12px,2.2vw,17px);font-variant-numeric:tabular-nums}.average .label{font-size:.82em}.average strong{font-size:1.15em;font-weight:600}.average small{font-size:.74em;color:var(--muted)}
    .history-panel{justify-content:flex-start;padding:7px 10px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.history-head .label{font-size:10px}.history-list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:#52667b transparent}.lap-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 1px;border-bottom:1px solid #203147;font-size:clamp(10px,1.55vw,13px);font-variant-numeric:tabular-nums}.lap-row:last-child{border:0}.lap-row .lap-no{color:var(--muted);font-size:.85em}.lap-row .lap-time{text-align:right;white-space:nowrap}.lap-row .lap-diff{min-width:54px;text-align:right;font-size:.82em;color:var(--muted)}.lap-row .lap-diff.late{color:var(--orange)}.empty-laps{color:#75879d;text-align:center;font-size:11px;margin:auto}
    .status{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:10px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#61748a}.status.live{color:#c4f8ed}.status.live .dot{background:var(--cyan);box-shadow:0 0 9px #56e0d0aa}.status.error{color:#ffb5a4}.status.error .dot{background:var(--red)}
    .bottom-bar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.controls{display:flex;justify-content:flex-end;gap:7px}.action{border:1px solid var(--line);background:#122236;border-radius:11px;min-height:36px;padding:0 14px;font-size:12px;font-weight:700;white-space:nowrap}.action:disabled{opacity:.38}.action.primary{background:var(--cyan);color:#08201f;border-color:transparent;min-width:100px}.action.lap{color:#dce8f4}.action.csv{padding:0 10px;color:var(--muted)}
    dialog{width:min(340px,calc(100vw - 36px));border:1px solid #34506b;border-radius:18px;background:#0e1b2b;color:var(--white);padding:18px;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#020812bb}.settings-title{font-weight:700;font-size:16px;margin:0 0 15px}.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin:12px 0;color:#becddd;font-size:13px}.field input{width:94px;background:#081421;border:1px solid #31465c;border-radius:8px;padding:8px;text-align:right;font-variant-numeric:tabular-nums}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media (orientation:landscape) and (min-width:560px){.app{height:100svh;min-height:250px;grid-template-rows:28px minmax(0,1fr) 40px;gap:8px;padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:calc(7px + env(safe-area-inset-bottom))}.dashboard{grid-template-rows:minmax(75px,.78fr) minmax(110px,1.22fr);gap:9px}.panel{border-radius:15px}.bottom-bar{grid-template-columns:1fr auto}.action{min-height:34px}}
    @media (orientation:portrait),(max-width:559px){.app{grid-template-rows:32px auto auto;min-height:100svh}.dashboard{grid-template-columns:minmax(90px,.8fr) minmax(150px,1.3fr);grid-template-rows:95px 120px 155px}.target-panel{grid-column:1 / -1;grid-row:2}.lap-count-panel{grid-column:1;grid-row:3}.speed-panel{grid-column:2;grid-row:3}.history-panel{grid-column:1 / -1;grid-row:4;min-height:135px}.timer{font-size:clamp(25px,8vw,40px)}.delta{font-size:clamp(24px,7vw,38px)}.bottom-bar{grid-template-columns:1fr;gap:6px}.status{justify-content:flex-start;padding-left:3px}.controls{justify-content:stretch}.action{flex:1;padding:0 8px}.speed-reading{font-size:clamp(42px,13vw,68px)}}
    @media(max-height:340px) and (orientation:landscape){.app{grid-template-rows:22px minmax(0,1fr) 32px;gap:5px;padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}.dashboard{grid-template-rows:minmax(63px,.75fr) minmax(90px,1.25fr);gap:6px}.panel{padding:6px 9px;border-radius:12px}.action{min-height:29px;font-size:10px}.brand{font-size:10px}.lap-row{padding:1px;font-size:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17a9 9 0 1 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m12 13 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="13" r="1.7" fill="currentColor"/></svg></span>GPS SPEED</div>
      <div class="header-tools"><div class="unit" role="group" aria-label="速度の単位"><button class="active" data-unit="kmh" aria-pressed="true">km/h</button><button data-unit="mph" aria-pressed="false">mph</button></div><button class="icon-button" id="settingsButton" aria-label="設定">設定</button></div>
    </header>
    <section class="dashboard" aria-label="ラップ計測">
      <div class="panel timer-panel"><div class="label">残りタイム</div><div class="timer" id="countdown" aria-live="off">05:20.000</div></div>
      <div class="panel delta-panel"><div class="label">目標タイムとの差</div><div class="delta" id="delta">±00:00.000</div></div>
      <div class="panel target-panel"><div class="label">目標 / 最大ズレ</div><div class="target-lines"><span class="key">TGT</span><span class="val" id="targetDisplay">05:20.000</span><span class="key">Max</span><span class="val max" id="maxDelta">±00:00.000</span></div></div>
      <div class="panel lap-count-panel"><div class="label">ラップ</div><div class="lap-count"><span id="lapCount">0</span><small> / <span id="lapLimit">7</span></small></div><div class="lap-progress"><span id="lapProgress"></span></div></div>
      <div class="panel speed-panel"><div class="speed-reading"><span id="speed">0.0</span><small id="speedUnit">km/h</small></div><div class="average"><span class="label">平均</span><strong id="averageSpeed">0.0</strong><small id="averageUnit">km/h</small></div></div>
      <div class="panel history-panel"><div class="history-head"><span class="label">これまでのラップ</span><span class="label" id="lapSummary">0 周</span></div><div class="history-list" id="lapList"><div class="empty-laps" id="emptyLaps">LAP ボタンで記録</div></div></div>
    </section>
    <footer class="bottom-bar"><div class="status" id="gpsStatus" aria-live="polite"><span class="dot"></span><span id="gpsText">測定を開始してください</span></div><div class="controls"><button class="action" id="reset">リセット</button><button class="action csv" id="export" disabled>CSV</button><button class="action lap" id="lapButton" disabled>LAP</button><button class="action primary" id="toggle">開始</button></div></footer>
  </main>
  <dialog id="settingsDialog"><form method="dialog" id="settingsForm"><h2 class="settings-title">計測設定</h2><label class="field">ラップ目標タイム<input id="targetInput" type="text" value="5:20.000" inputmode="numeric" aria-label="目標タイム（分:秒.ミリ秒）"></label><label class="field">目標ラップ数<input id="lapsInput" type="number" min="1" max="99" value="7" aria-label="目標ラップ数"></label><div class="dialog-actions"><button class="action" value="cancel">閉じる</button><button class="action primary" id="saveSettings" value="save">保存</button></div></form></dialog>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), dialog=$('settingsDialog');
      let unit='kmh',running=false,watchId=null,activeStartedAt=0,sessionElapsed=0,lapElapsed=0,targetMs=320000,lapLimit=7,maxAbsDeviation=0,totalDistance=0,currentMps=0,lastPosition=null,wakeLock=null,tickId=null;
      const laps=[],samples=[];
      const speedFactor=()=>unit==='kmh'?3.6:2.236936,displaySpeed=mps=>(mps*speedFactor()).toFixed(1);
      const fmt=ms=>{ms=Math.max(0,Math.floor(ms));const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=ms%1000;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(x).padStart(3,'0')};
      const fmtDelta=ms=>(ms<0?'−':ms>0?'+':'±')+fmt(Math.abs(ms)).replace(/^\d{2}:/,'');
      const elapsedNow=()=>sessionElapsed+(running?performance.now()-activeStartedAt:0),lapNow=()=>lapElapsed+(running?performance.now()-activeStartedAt:0);
      function setStatus(id,text,type=''){const el=$(id);el.className='status '+type;const t=el.querySelector('span:last-child');if(t)t.textContent=text}
      function renderTime(){const lap=lapNow(),deviation=lap-targetMs,remaining=targetMs-lap;$('countdown').textContent=remaining>=0?fmt(remaining):'+'+fmt(-remaining);$('countdown').style.color=remaining<0?'var(--red)':'';$('delta').textContent=fmtDelta(deviation);$('delta').classList.toggle('late',deviation>0);maxAbsDeviation=Math.max(maxAbsDeviation,Math.abs(deviation));$('maxDelta').textContent='±'+fmt(maxAbsDeviation).replace(/^\d{2}:/,'');}
      function render(){renderTime();$('lapCount').textContent=laps.length;$('lapLimit').textContent=lapLimit;$('lapSummary').textContent=laps.length+' 周';$('lapProgress').style.width=Math.min(100,laps.length/lapLimit*100)+'%';$('speed').textContent=displaySpeed(currentMps);$('speedUnit').textContent=unit;$('averageSpeed').textContent=displaySpeed(elapsedNow()>0?totalDistance/(elapsedNow()/1000):0);$('averageUnit').textContent=unit;$('export').disabled=samples.length===0&&laps.length===0}
      function renderLaps(){const list=$('lapList');list.replaceChildren();if(!laps.length){const e=document.createElement('div');e.className='empty-laps';e.textContent='LAP ボタンで記録';list.append(e);return}laps.slice().reverse().forEach(l=>{const row=document.createElement('div');row.className='lap-row';const n=document.createElement('span');n.className='lap-no';n.textContent=String(l.no).padStart(2,'0');const tm=document.createElement('span');tm.className='lap-time';tm.textContent=fmt(l.time);const d=document.createElement('span');d.className='lap-diff'+(l.diff>0?' late':'');d.textContent=fmtDelta(l.diff);row.append(n,tm,d);list.append(row)})}
      function updateFromPosition(pos){const c=pos.coords;let mps=c.speed;const now=pos.timestamp;if(lastPosition){const dt=(now-lastPosition.time)/1000;if(dt>0){const rad=x=>x*Math.PI/180,R=6371000,dLat=rad(c.latitude-lastPosition.lat),dLon=rad(c.longitude-lastPosition.lon),a=Math.sin(dLat/2)**2+Math.cos(rad(lastPosition.lat))*Math.cos(rad(c.latitude))*Math.sin(dLon/2)**2,dist=2*R*Math.asin(Math.sqrt(Math.min(1,a)));if(c.accuracy<60&&lastPosition.accuracy<60&&dist>Math.max(c.accuracy,lastPosition.accuracy)*.25)totalDistance+=dist;if(mps==null)mps=dist/dt}}lastPosition={lat:c.latitude,lon:c.longitude,time:now,accuracy:c.accuracy};currentMps=Math.max(0,mps||0);samples.push({time:new Date(now).toISOString(),elapsed:elapsedNow(),speed:currentMps*3.6,accuracy:c.accuracy});setStatus('gpsStatus',c.accuracy>50?'GPS精度が低めです':'GPS計測中','live');render()}
      function gpsError(e){const messages={1:'位置情報を許可してください',2:'GPSを受信できません',3:'GPSの取得がタイムアウトしました'};pause();setStatus('gpsStatus',messages[e.code]||'GPSを取得できません','error')}
      async function start(){if(running||laps.length>=lapLimit)return;if(!('geolocation'in navigator)){setStatus('gpsStatus','このブラウザはGPSに非対応です','error');return}if(!isSecureContext){setStatus('gpsStatus','GPSにはHTTPS接続が必要です','error');return}running=true;activeStartedAt=performance.now();lastPosition=null;try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}watchId=navigator.geolocation.watchPosition(updateFromPosition,gpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});$('toggle').textContent='停止';$('lapButton').disabled=false;setStatus('gpsStatus','GPSの位置を取得中…');tickId=setInterval(render,40);render()}
      function pause(clearGps=true){if(!running)return;const span=performance.now()-activeStartedAt;sessionElapsed+=span;lapElapsed+=span;running=false;if(clearGps&&watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(tickId){clearInterval(tickId);tickId=null}if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}$('toggle').textContent='再開';$('lapButton').disabled=true;lastPosition=null;render();setStatus('gpsStatus','一時停止')}
      function markLap(){if(!running||laps.length>=lapLimit)return;const span=performance.now()-activeStartedAt;sessionElapsed+=span;lapElapsed+=span;const diff=lapElapsed-targetMs;laps.push({no:laps.length+1,time:lapElapsed,diff});maxAbsDeviation=Math.max(maxAbsDeviation,Math.abs(diff));activeStartedAt=performance.now();lapElapsed=0;lastPosition=null;renderLaps();if(laps.length>=lapLimit){pause();$('toggle').textContent='完了';$('lapButton').disabled=true}render()}
      function reset(){if(running)pause();if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}sessionElapsed=0;lapElapsed=0;activeStartedAt=0;maxAbsDeviation=0;totalDistance=0;currentMps=0;lastPosition=null;laps.length=0;samples.length=0;$('toggle').textContent='開始';$('lapButton').disabled=true;setStatus('gpsStatus','測定を開始してください');renderLaps();render()}
      $('toggle').addEventListener('click',()=>running?pause():start());$('lapButton').addEventListener('click',markLap);$('reset').addEventListener('click',reset);
      document.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});render()}));
      $('settingsButton').addEventListener('click',()=>{if(running)return;$('targetInput').value=Math.floor(targetMs/60000)+':'+String(Math.floor(targetMs%60000/1000)).padStart(2,'0')+'.'+String(targetMs%1000).padStart(3,'0');$('lapsInput').value=lapLimit;dialog.showModal()});
      $('settingsForm').addEventListener('submit',e=>{if(e.submitter?.id!=='saveSettings')return;e.preventDefault();const m=$('targetInput').value.trim().match(/^(\d{1,3}):(\d{1,2})(?:\.(\d{1,3}))?$/),n=Number($('lapsInput').value);if(!m||Number(m[2])>59||!Number.isInteger(n)||n<1||n>99){setStatus('gpsStatus','目標は「分:秒.ミリ秒」、ラップ数は1〜99です','error');return}targetMs=(Number(m[1])*60+Number(m[2]))*1000+Number((m[3]||'').padEnd(3,'0'));lapLimit=n;$('targetDisplay').textContent=fmt(targetMs);maxAbsDeviation=0;dialog.close();render()});
      $('export').addEventListener('click',()=>{const rows=[['種類','時刻 (UTC)','経過(ms)','ラップ','時間(ms)','差(ms)','速度(km/h)','GPS精度(m)'],...samples.map(s=>['GPS',s.time,Math.round(s.elapsed),'','','',s.speed.toFixed(2),s.accuracy.toFixed(1)]),...laps.map(l=>['LAP','','',''+l.no,Math.round(l.time),Math.round(l.diff),'',''])],csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gps-lap-'+new Date().toISOString().replaceAll(':','-')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
      document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&running&&'wakeLock'in navigator)try{wakeLock=await navigator.wakeLock.request('screen')}catch{}});
      if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
      $('targetDisplay').textContent=fmt(targetMs);renderLaps();render();
    })();
  </script>
</body>
</html>

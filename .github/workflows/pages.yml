name: Publish GPS speedometer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js icon.svg site/
          touch site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
